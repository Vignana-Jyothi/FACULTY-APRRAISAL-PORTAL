# Grafana reads this on start, so both data sources exist on first login —
# nothing to add by hand. The URLs are compose service names.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
