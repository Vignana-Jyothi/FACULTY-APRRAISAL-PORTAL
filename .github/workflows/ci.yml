name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend — build + test
    runs-on: ${{ github.ref == 'refs/heads/main' && 'gamma' || 'dev-ai' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faculty_appraisal
        ports:
          - 5477:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5477/faculty_appraisal
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      JWT_EXPIRES_IN: 8h
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret-at-least-32-characters-long
      REFRESH_TOKEN_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5177
      EMAIL_DISABLED: 'true'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        # npm install, not ci: the Windows-generated lockfile omits Linux/WASM
        # optional deps (@emnapi/*), which makes `npm ci` fail on Linux runners.
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate

      - name: Push schema to test DB
        working-directory: backend
        run: npx prisma db push --schema=src/prisma/schema.prisma --skip-generate

      - name: Seed test DB
        working-directory: backend
        run: npm run seed

      - name: TypeScript build
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — lint + build
    runs-on: ${{ github.ref == 'refs/heads/main' && 'gamma' || 'dev-ai' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm install, not ci: Windows lockfile omits Linux/WASM optional deps.
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to Gamma Server
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: gamma

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EMAIL_DISABLED=${{ secrets.EMAIL_DISABLED }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
          DEFAULT_IMPORT_PASSWORD=${{ secrets.DEFAULT_IMPORT_PASSWORD }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          HTTP_BIND=${{ secrets.HTTP_BIND }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          EOF

      - name: Start containers
        run: docker compose -f docker-compose.prod.yml up -d --build

